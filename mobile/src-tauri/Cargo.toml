[package]
name = "gboheme-mobile"
version = "2.10.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "gboheme_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = ">=2.11.1, <3", features = [] }
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
